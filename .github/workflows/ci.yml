name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: Install FLINT oracle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev
          python3 -m pip install --user python-flint
      - name: Build library
        run: lake build
      - name: Build conformance sidecar
        run: |
          cd conformance
          lake build
      - name: Conformance oracle
        run: |
          cd conformance
          lake exe hexpoly_emit_fixtures > /tmp/hex-poly-fresh.jsonl
          cd ..
          diff -u conformance-fixtures/HexPoly/poly.jsonl /tmp/hex-poly-fresh.jsonl
          python3 scripts/oracle/poly_flint.py < /tmp/hex-poly-fresh.jsonl
      - name: Build + full bench verify
        env:
          BENCH_VERIFY_HARD_CAP_SECONDS: "360"
          HEX_FLINT_BENCH_DRIVER: ${{ github.workspace }}/scripts/oracle/flint_bench_driver.py
          HEX_FLINT_BENCH_PYTHON: python3
        run: |
          cd bench
          lake build hexpoly_bench
          bash ../scripts/ci/check_bench_verify_budget.sh hexpoly_bench
      - name: Assert Mathlib-free
        run: |
          if find .lake bench/.lake conformance/.lake -type d -name Mathlib 2>/dev/null | grep -q .; then
            echo "ERROR: a Lake build pulled in Mathlib"; exit 1; fi
          if grep -rqE '^import Mathlib' HexPoly conformance/HexPoly bench/HexPoly 2>/dev/null; then
            echo "ERROR: a source file imports Mathlib"; exit 1; fi
          echo "Mathlib-free OK"
