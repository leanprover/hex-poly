name = "hex-poly-conformance"
defaultTargets = ["HexPolyConformance"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPoly"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "5b3dc5d7789cb680d64f8f4046254f93b7424e4f"

[[lean_lib]]
name = "HexPolyConformance"
globs = ["HexPoly.Conformance"]

[[lean_exe]]
name = "hexpoly_emit_fixtures"
root = "HexPoly.EmitFixtures"
