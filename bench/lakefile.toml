name = "hex-poly-bench"
defaultTargets = ["hexpoly_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPoly"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "26e3c46c6263b741a6e1fdaf5e5fc03832ec5b79"

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

[[lean_exe]]
name = "hexpoly_bench"
root = "HexPoly.Bench"
